<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Penggunaan Tag Select</title>
</head>
<body>
    <h3>Select biasa</h3>
    <select>
        <option>Pilihan 1</option>
        <option>Pilihan 2</option>
        <option value="pilihan ketiga">Pilihan 3</option>
    </select>

    <h3>Select dengan nilai awal (selected)</h3>
    <select>
        <option>Pilihan 1</option>
        <option>Pilihan 2</option>
        <option value="pilihan ketiga" selected>Pilihan 3</option>
    </select>
</body>
</html>
