<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Belajar Membuat Form</title>
</head>
<body>
    <form action="formulir.html" method="get">
        <p>
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" value="Nama Kamu" />
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" />
        </p>

        <p>
            Jenis Kelamin:
            <input type="radio" id="laki" name="jenis_kelamin" value="laki-laki" checked />
            <label for="laki">Laki - Laki</label>
            <input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan" />
            <label for="perempuan">Perempuan</label>
        </p>

        <p>
            Hobi:
            <input type="checkbox" id="baca" name="hobi_baca" />
            <label for="baca">Membaca Buku</label>
            <input type="checkbox" id="nulis" name="hobi_nulis" checked />
            <label for="nulis">Menulis</label>
            <input type="checkbox" id="mancing" name="hobi_mancing" />
            <label for="mancing">Memancing</label>
        </p>

        <p>
            <label for="asal_kota">Asal Kota:</label>
            <select id="asal_kota" name="asal_kota">
                <option value="Kota Jakarta">Jakarta</option>
                <option>Bandung</option>
                <option value="Kota Semarang" selected>Semarang</option>
            </select>
        </p>

        <p>
            <label for="komentar">Komentar Anda:</label>
            <br />
            <textarea id="komentar" name="komentar" rows="5" cols="20">Silahkan katakan isi hati anda</textarea>
        </p>

        <p>
            <input type="submit" value="Mulai Proses!" />
        </p>
    </form>
</body>
</html>
